<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPI Guard</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6ec; --accent:#2f6fed; --bad:#d14343; --warn:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1a1e26; --text:#e6e8ec; --muted:#9aa1ad; --line:#2a303b; --accent:#5b8cff; --bad:#ff6b6b; --warn:#e0a84a; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:16px; flex-wrap:wrap }
  header h1 { margin:0; font-size:18px } header span { color:var(--muted) }
  main { padding:20px 24px; display:grid; gap:16px; grid-template-columns:1fr }
  @media (min-width: 1100px) { main { grid-template-columns:1.4fr 1fr 1fr } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0 }
  h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  .kpis { display:flex; gap:24px; flex-wrap:wrap } .kpi b { display:block; font-size:22px }
  table { width:100%; border-collapse:collapse } td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; overflow-wrap:anywhere }
  th { color:var(--muted); font-weight:500; white-space:nowrap } td.num { text-align:right; font-variant-numeric:tabular-nums }
  button { white-space:nowrap; border:1px solid var(--line); background:transparent; color:var(--text); border-radius:6px; padding:3px 10px; cursor:pointer }
  button.block { border-color:var(--bad); color:var(--bad) } form { display:flex; gap:8px; margin-bottom:10px }
  input { flex:1; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text) }
  .warn { color:var(--warn) } .muted { color:var(--muted) } svg { width:100%; height:60px }
</style>
</head>
<body>
<header><h1>DPI Guard</h1><span id="sub">connecting...</span></header>
<main>
  <section style="grid-column:1/-1">
    <div class="kpis">
      <div class="kpi"><span class="muted">Domains seen</span><b id="k-domains">-</b></div>
      <div class="kpi"><span class="muted">Packets (flows)</span><b id="k-packets">-</b></div>
      <div class="kpi"><span class="muted">Dropped in kernel</span><b id="k-dropped">-</b></div>
      <div class="kpi"><span class="muted">Block rules</span><b id="k-rules">-</b></div>
    </div>
    <svg id="spark" viewBox="0 0 600 60" preserveAspectRatio="none" aria-label="packets per second"></svg>
  </section>
  <section><h2>Live domains</h2><table><thead><tr><th>Domain</th><th>App</th><th class="num">Packets</th><th></th></tr></thead><tbody id="domains"></tbody></table></section>
  <section>
    <h2>Block rules</h2>
    <form id="add"><input id="rule" placeholder="example.com (includes subdomains)" required><button>Block</button></form>
    <table><tbody id="rules"></tbody></table>
    <h2 style="margin-top:16px">Blocked IPs</h2>
    <table><thead><tr><th>IP</th><th class="num">Dropped pkts</th></tr></thead><tbody id="blocked"></tbody></table>
    <div id="collateral"></div>
  </section>
  <section><h2>Enforcement log</h2><table><thead><tr><th>Domain / IP</th><th class="num">Detect→drop</th></tr></thead><tbody id="events"></tbody></table></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (path, opts) => fetch(path, opts).then((r) => r.json());
async function block(rule) { await api("/api/rules", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({rule})}); refresh(); }
async function unblock(rule) { await api("/api/rules/" + encodeURIComponent(rule), {method:"DELETE"}); refresh(); }
$("add").onsubmit = (e) => { e.preventDefault(); block($("rule").value.trim()); $("rule").value = ""; };
function spark(history) {
  if (!history.length) return $("spark").innerHTML = "";
  const max = Math.max(...history.map((h) => h[1]), 1), n = history.length;
  const pts = history.map((h, i) => `${(i / Math.max(n - 1, 1)) * 600},${58 - (h[1] / max) * 54}`).join(" ");
  $("spark").innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
}
async function refresh() {
  const s = await api("/api/state");
  $("sub").textContent = `enforcer: ${s.enforcer} · updated ${new Date().toLocaleTimeString()}`;
  $("k-domains").textContent = s.totals.domains; $("k-packets").textContent = `${s.totals.packets} (${s.totals.flows})`;
  $("k-dropped").textContent = s.kernel.dropped_packets; $("k-rules").textContent = s.rules.length;
  $("domains").innerHTML = s.domains.map((d) => `<tr><td>${esc(d.domain)}</td><td class="muted">${esc(d.application)}</td><td class="num">${d.packets}</td><td><button class="block" data-rule="${esc(d.domain)}">Block</button></td></tr>`).join("");
  $("rules").innerHTML = s.rules.map((r) => `<tr><td>${esc(r)}</td><td style="text-align:right"><button data-unblock="${esc(r)}">Unblock</button></td></tr>`).join("") || `<tr><td class="muted">No rules yet</td></tr>`;
  $("blocked").innerHTML = Object.entries(s.blocked).map(([ip, c]) => `<tr><td>${esc(ip)}</td><td class="num">${c.packets}</td></tr>`).join("");
  $("collateral").innerHTML = Object.entries(s.collateral).map(([ip, ds]) => `<p class="warn">⚠ ${esc(ip)} also serves allowed: ${ds.map(esc).join(", ")}</p>`).join("");
  $("events").innerHTML = s.events.slice().reverse().map((e) => `<tr><td>${esc(e.domain)}<br><span class="muted">${esc(e.ip)} · ${esc(e.mode)}</span></td><td class="num" style="white-space:nowrap">${((e.enforced_at - e.detected_at) * 1000).toFixed(1)} ms</td></tr>`).join("");
  spark(s.history);
}
document.addEventListener("click", (e) => {
  if (e.target.dataset.rule) block(e.target.dataset.rule);
  if (e.target.dataset.unblock) unblock(e.target.dataset.unblock);
});
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
